# Include these locations inside an HTTPS Nginx server block.
# Replace every repository path below with the absolute deployment checkout path.
root /srv/hanvika/cloudprintagent;
include /srv/hanvika/cloudprintagent/deploy/security-headers.conf;

location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /srv/hanvika/cloudprintagent/deploy/security-headers.conf;
    try_files /manifest.json =404;
}

location = /sw.js {
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache" always;
    include /srv/hanvika/cloudprintagent/deploy/security-headers.conf;
    try_files /sw.js =404;
}

location = /offline.html {
    add_header Cache-Control "no-cache" always;
    include /srv/hanvika/cloudprintagent/deploy/security-headers.conf;
    try_files /offline.html =404;
}

location ^~ /icons/ {
    expires 30d;
    try_files $uri =404;
}

location / {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
