# Include only from an HTTPS server block. Add includeSubDomains only if every
# subdomain is permanently HTTPS-enabled.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Start in report-only mode. Review browser reports for Streamlit/CDN needs
# before enforcing a Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lokeshkumarpuvvada.github.io; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self';" always;
